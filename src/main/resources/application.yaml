spring:
  application:
    name: airsense-backend
  datasource:
    url: jdbc:h2:mem:airsensedb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: true
  h2:
    console:
      enabled: true

server:
  port: ${PORT:8080}

airsense:
  admin:
    email: ${ADMIN_EMAIL:admin@airsense.com}
    password: ${ADMIN_PASSWORD:admin123}
  jwt:
    # Mínimo de 32 caracteres (HS256). Em produção, defina JWT_SECRET no ambiente.
    secret: ${JWT_SECRET:chave-secreta-airsense-pucpr-muito-segura-256bits}